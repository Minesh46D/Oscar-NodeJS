<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .hidden{
            display: none;
        }
    </style>
</head>
<body>
    <div id="main" class="container py-4">
        <h2 class="text-center">Stopwatch</h2>
        <div class="mt-5">
            <div class="w-50 bg-white shadow rounded-5 text-center m-auto">
                <p id="time" class="h2"><span id="hr">00</span> : <span id="min">00</span> : <span id="sec">00</span> : <span id="ms">00</span></p>
                <div class="mt-3">
                    <button class="btn btn-primary">Start</button>
                    <button class="btn btn-primary hidden">Stop</button>
                    <button class="btn btn-warning">Reset</button>
                    <button class="btn btn-warning hidden">Lap</button>
                </div>
            </div>
        </div>
        <div class="mt-5">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>
    <script>
        let startInterval;

        const tbody = document.querySelector('tbody')
        const button1 = document.querySelectorAll('.btn-primary')
        const button2 = document.querySelectorAll('.btn-warning')
        const hour = document.getElementById('hr')
        const minute = document.getElementById('min')
        const second = document.getElementById('sec')
        const milisec = document.getElementById('ms')
        const time = document.getElementById('time')
        let hr = 0, min = 0, sec = 0, ms = 0
        let count = 0
        const lap = []

        button1.forEach((x) => {
            x.addEventListener('click', () => {
                    button1.forEach((btn) => btn.classList.toggle('hidden'))
                    button2.forEach((btn) => btn.classList.toggle('hidden'))
                    if(x.innerHTML == 'Start'){
                        startInterval = setInterval(() => {
                            count++
                            if(count >= 100){
                                sec++
                                count = 0
                            }if(sec >= 60){
                                min++
                                sec = 0
                            }if(min >= 60){
                                hour++;
                                min = 0
                            }
            
                            hour.innerHTML = hr > 9 ? hr : '0' + hr
                            minute.innerHTML = min > 9 ? min : '0' + min
                            second.innerHTML = sec > 9 ? sec : '0' + sec
                            milisec.innerHTML = count > 9 ? count : '0' + count
                        }, 10);
                }else{
                    clearInterval(startInterval)
                }
            })
        })
        button2.forEach(x => {
            x.addEventListener('click',  () => {
                if(x.innerHTML == 'Lap'){
                    lap.push(time.innerHTML)
                    console.log(lap)
                }
                lap.map((x, id) => {
                        console.log(x, id)
                    })
                tbody.innerHTML = `${
                    lap.map((x, id) => {
                        return (
                            `<tr>
                                <td>${id}</td>
                                <td>${x}</td>
                            </tr>`
                        )
                    })
                }`
            })
        })
    </script>
</body>
</html>
