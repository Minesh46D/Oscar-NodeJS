<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud with JS</title>
    <link rel="stylesheet" href="./../output.css">
</head>
<body>
    <!-- fname, lastname, email, password, gender, skill, date, age, select(active/inactive) -->
    <div id="main" class="container m-auto">
        <h2 class="text-center my-8 text-red-500 text-4xl">Crud with JS</h2>
    <form onsubmit="handleSubmit(event)">
        <div class="grid grid-cols-2 gap-4">
            <div class="">
                <label for="firstName" class="">First Name</label>
                <input type="text" class="" id="firstName" name="firstName">
            </div>
            <div class="">
                <label for="lastName" class="">Last Name</label>
                <input type="text" class="" id="lastName" name="lastName">
            </div>
            <div class="">
                <label for="email" class="">Email</label>
                <input type="email" class="" id="email" name="email">
            </div>
            <div class="">
                <label for="password" class="">Password</label>
                <input type="password" class="" id="password" name="password">
            </div>
            <div class="">
                <label for="date" class="">Date</label>
                <input type="date" class="" id="date" name="date">
            </div>
            <div class="">
                <label for="age" class="">Age</label>
                <input type="number" max="100" class="" id="age" name="age">
            </div>
            <div class="">
                Gender:
                <div class="">
                    <label for="g-male" class="">Male</label>
                    <input type="radio" class="" id="g-male" name="gender" value="Male">
                </div>
                <div class="">
                    <label for="g-female" class="">Female</label>
                    <input type="radio" class="" id="g-female" name="gender" value="Female">
                </div>
                <div class="">
                    <label for="g-other" class="">Other</label>
                    <input type="radio" class="" id="g-other" name="gender" value="Other">
                </div>
            </div>
            <div class="">
                Skill:
                <div class="">
                    <label for="s-react" class="">React</label>
                    <input type="checkbox" class="" id="s-react" name="skill" value="React">
                </div>
                <div class="">
                    <label for="s-angular" class="">Angular</label>
                    <input type="checkbox" class="" id="s-angular" name="skill" value="Angular">
                </div>
                <div class="">
                    <label for="s-dotnet" class="">DotNet</label>
                    <input type="checkbox" class="" id="s-dotnet" name="skill" value="DotNet">
                </div>
            </div>
            <div class="">
                <label for="active">Active</label>
                <select name="active" id="active">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
        </div>
        <div class="text-center mt-5">
            <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800  font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Submit</button>
            
        </div>
    </form>

    <table class="table-auto w-full text-center mt-5">
        <thead>
            <tr>
                <th>id</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Date</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Skills</th>
                <th>Active</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            
        </tbody>
    </table>
    </div>
    


    <script src="CrudwithJS.js"></script>
</body>
</html>
