<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crud with JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body class="bg-info-subtle">
    <div id="main">
        <div class="container py-4 mt-4 bg-white p-5 rounded-5 shadow-lg">
            <h2 class="text-center">Crud with JS</h2>
            <form id="form1">
                <fieldset class="px-5 py-4 bg-light rounded-5 shadow mb-4 pb-5">
                    <div class="row row-cols-1 row-cols-lg-2">
                        <div class="col mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName">
                        </div>
                        <div class="col mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName">
                        </div>
                        <div class="col mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <div class="col mb-3">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address">
                        </div>
                        <div class="col mb-3">
                            Gender:
                            <div class="form-check">
                                <label for="male" class="form-check-label">Male</label>
                                <input type="radio" class="form-check-input" value="Male" id="male" name="gender">
                            </div>
                            <div class="form-check">
                                <label for="female" class="form-check-label">Female</label>
                                <input type="radio" class="form-check-input" value="Female" id="female" name="gender">
                            </div>
                            <div class="form-check">
                                <label for="other" class="form-check-label">Other</label>
                                <input type="radio" class="form-check-input" value="Other" id="other" name="gender">
                            </div>
                        </div>
                        <div class="col mb-3">
                            hobbies:
                            <div class="form-check">
                                <label for="cricket" class="form-check-label">Cricket</label>
                                <input type="checkbox" class="form-check-input" value="Cricket" id="cricket" name="hobbies">
                            </div>
                            <div class="form-check">
                                <label for="reading" class="form-check-label">Reading</label>
                                <input type="checkbox" class="form-check-input" value="Reading" id="reading" name="hobbies">
                            </div>
                            <div class="form-check">
                                <label for="writting" class="form-check-label">Writting</label>
                                <input type="checkbox" class="form-check-input" value="Writting" id="writting" name="hobbies">
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary mt-4" onclick="submitData(event)">Submit</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>













    <script src="CrudwithJS.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
